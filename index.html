<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>개인 대시보드</title>
  <style>
    :root {
      --bg: #12151a;
      --bg-elevated: #1a1f27;
      --card: #1e2430;
      --card-hover: #242b3a;
      --border: rgba(255, 255, 255, 0.06);
      --text: #e8ecf2;
      --text-muted: #8b95a8;
      --accent: #5b9fd4;
      --accent-soft: rgba(91, 159, 212, 0.15);
      --accent-strong: #7bb8e8;
      --danger: #e07a7a;
      --danger-soft: rgba(224, 122, 122, 0.15);
      --success: #6bc4a0;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(91, 159, 212, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 90% 0%, rgba(91, 159, 212, 0.06), transparent);
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    /* ── Top row ── */
    .hero-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: start;
      margin-bottom: 1.75rem;
    }

    .date-hero {
      padding: 0.5rem 0.25rem;
    }

    .date-hero .month-day {
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.15;
    }

    .date-hero .weekday {
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 500;
      margin-top: 0.35rem;
    }

    .date-hero .year {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    /* Weather card */
    .weather-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      min-width: 200px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .weather-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .weather-card .temp {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-strong);
      line-height: 1.2;
    }

    .weather-card .condition {
      font-size: 0.95rem;
      color: var(--text);
    }

    .weather-card .location {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .weather-card .fallback {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ── Bottom cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.4rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 320px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .card-header .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .card-header .icon svg {
      width: 16px;
      height: 16px;
    }

    .card-header h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Todos */
    .todo-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .todo-form input,
    .link-form input,
    .notes-area {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .todo-form input:focus,
    .link-form input:focus,
    .notes-area:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .todo-form input { flex: 1; min-width: 0; }

    .btn {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--accent-strong); }
    .btn:active { transform: scale(0.97); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0.25rem;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .btn-ghost:hover {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .todo-list, .link-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
      max-height: 240px;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .todo-item, .link-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.55rem;
      border-radius: var(--radius-sm);
      transition: background 0.12s;
    }

    .todo-item:hover, .link-item:hover {
      background: var(--card-hover);
    }

    .todo-item input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-muted);
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
    }

    .todo-item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-item input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid #0d1117;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .todo-item .text {
      flex: 1;
      font-size: 0.9rem;
      word-break: break-word;
      cursor: pointer;
    }

    .todo-item.done .text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .empty-hint {
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 0.75rem 0.25rem;
      text-align: center;
    }

    /* Notes */
    .notes-area {
      flex: 1;
      width: 100%;
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }

    .notes-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      text-align: right;
      min-height: 1.1em;
    }

    /* Links */
    .link-form {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .link-form-row {
      display: flex;
      gap: 0.5rem;
    }

    .link-form-row input { flex: 1; min-width: 0; }

    .link-item a {
      flex: 1;
      color: var(--accent-strong);
      text-decoration: none;
      font-size: 0.9rem;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .link-item a:hover { text-decoration: underline; }

    .link-item .link-icon {
      flex-shrink: 0;
      opacity: 0.7;
    }

    /* Footer whisper */
    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* Responsive */
    @media (max-width: 780px) {
      .cards { grid-template-columns: 1fr; }
      .hero-row {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
      .weather-card { min-width: 0; }
      .card { min-height: auto; }
    }

    @media (max-width: 480px) {
      .wrap { padding: 1.25rem 1rem 2rem; }
      .date-hero .month-day { font-size: 2.25rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Top: date + weather -->
    <div class="hero-row">
      <div class="date-hero">
        <div class="month-day" id="monthDay">—</div>
        <div class="weekday" id="weekday">—</div>
        <div class="year" id="yearLine"></div>
      </div>

      <div class="weather-card" id="weatherCard" aria-live="polite">
        <div class="label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            <circle cx="12" cy="12" r="4"/>
          </svg>
          날씨
        </div>
        <div class="temp" id="weatherTemp">…</div>
        <div class="condition" id="weatherCondition">불러오는 중</div>
        <div class="location" id="weatherLocation">내 위치 확인 중…</div>
      </div>
    </div>

    <!-- Bottom cards -->
    <div class="cards">
      <!-- Todos -->
      <section class="card" aria-labelledby="todoTitle">
        <div class="card-header">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
          </div>
          <h2 id="todoTitle">할 일</h2>
        </div>
        <form class="todo-form" id="todoForm">
          <input type="text" id="todoInput" placeholder="새 할 일 추가…" maxlength="200" autocomplete="off" />
          <button type="submit" class="btn">추가</button>
        </form>
        <ul class="todo-list" id="todoList"></ul>
      </section>

      <!-- Notes -->
      <section class="card" aria-labelledby="notesTitle">
        <div class="card-header">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
            </svg>
          </div>
          <h2 id="notesTitle">메모</h2>
        </div>
        <textarea class="notes-area" id="notesArea" placeholder="자유롭게 메모하세요…" spellcheck="false"></textarea>
        <div class="notes-status" id="notesStatus"></div>
      </section>

      <!-- Links -->
      <section class="card" aria-labelledby="linksTitle">
        <div class="card-header">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
            </svg>
          </div>
          <h2 id="linksTitle">링크</h2>
        </div>
        <form class="link-form" id="linkForm">
          <input type="text" id="linkName" placeholder="이름" maxlength="80" autocomplete="off" />
          <div class="link-form-row">
            <input type="url" id="linkUrl" placeholder="https://…" autocomplete="off" />
            <button type="submit" class="btn">추가</button>
          </div>
        </form>
        <ul class="link-list" id="linkList"></ul>
      </section>
    </div>

    <p class="footer">로컬에 저장 · 개인 대시보드</p>
  </div>

  <script>
    (function () {
      "use strict";

      /* ── Storage keys ── */
      var KEY_TODOS = "pd_todos";
      var KEY_NOTES = "pd_notes";
      var KEY_LINKS = "pd_links";

      /* ── Korean date (no clock) ── */
      var WEEKDAYS = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

      function renderDate() {
        var now = new Date();
        var m = now.getMonth() + 1;
        var d = now.getDate();
        var y = now.getFullYear();
        document.getElementById("monthDay").textContent = m + "월 " + d + "일";
        document.getElementById("weekday").textContent = WEEKDAYS[now.getDay()];
        document.getElementById("yearLine").textContent = y + "년";
      }

      /* ── Weather (Open-Meteo, device location, °F) ── */
      var WMO_KO = {
        0: "맑음",
        1: "대체로 맑음",
        2: "부분적으로 흐림",
        3: "흐림",
        45: "안개",
        48: "착빙 안개",
        51: "가벼운 이슬비",
        53: "이슬비",
        55: "강한 이슬비",
        56: "가벼운 어는 이슬비",
        57: "어는 이슬비",
        61: "가벼운 비",
        63: "비",
        65: "강한 비",
        66: "가벼운 어는 비",
        67: "어는 비",
        71: "가벼운 눈",
        73: "눈",
        75: "강한 눈",
        77: "싸락눈",
        80: "가벼운 소나기",
        81: "소나기",
        82: "강한 소나기",
        85: "가벼운 눈 소나기",
        86: "강한 눈 소나기",
        95: "뇌우",
        96: "약한 우박 뇌우",
        99: "강한 우박 뇌우"
      };

      function setWeatherFallback(msg, locLabel) {
        document.getElementById("weatherTemp").textContent = "—";
        document.getElementById("weatherCondition").textContent = msg || "날씨를 불러올 수 없습니다";
        document.getElementById("weatherCondition").classList.add("fallback");
        document.getElementById("weatherLocation").textContent = locLabel || "내 위치";
      }

      function fetchWeatherAt(lat, lon, locLabel) {
        var url =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=" + encodeURIComponent(lat) +
          "&longitude=" + encodeURIComponent(lon) +
          "&current=temperature_2m,weather_code" +
          "&temperature_unit=fahrenheit" +
          "&timezone=auto";

        return fetch(url)
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            var cur = data.current;
            if (!cur) throw new Error("no current");
            var temp = Math.round(cur.temperature_2m);
            var code = cur.weather_code;
            var cond = WMO_KO[code] || "알 수 없음";
            document.getElementById("weatherTemp").textContent = temp + "°F";
            document.getElementById("weatherCondition").textContent = cond;
            document.getElementById("weatherCondition").classList.remove("fallback");
            document.getElementById("weatherLocation").textContent = locLabel || "내 위치";
          });
      }

      function fetchWeather() {
        document.getElementById("weatherLocation").textContent = "내 위치 확인 중…";
        document.getElementById("weatherCondition").textContent = "불러오는 중";

        if (!navigator.geolocation) {
          setWeatherFallback("위치 기능을 쓸 수 없습니다", "내 위치");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            var lat = pos.coords.latitude;
            var lon = pos.coords.longitude;
            fetchWeatherAt(lat, lon, "내 위치").catch(function () {
              setWeatherFallback("오프라인 · 날씨 없음", "내 위치");
            });
          },
          function () {
            setWeatherFallback("위치 허용이 필요해요", "내 위치");
          },
          { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 }
        );
      }

      /* ── Todos ── */
      function loadTodos() {
        try {
          var raw = localStorage.getItem(KEY_TODOS);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveTodos(todos) {
        localStorage.setItem(KEY_TODOS, JSON.stringify(todos));
      }

      function renderTodos() {
        var list = document.getElementById("todoList");
        var todos = loadTodos();
        list.innerHTML = "";

        if (todos.length === 0) {
          list.innerHTML = '<li class="empty-hint">할 일이 없습니다</li>';
          return;
        }

        todos.forEach(function (t) {
          var li = document.createElement("li");
          li.className = "todo-item" + (t.done ? " done" : "");

          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!t.done;
          cb.setAttribute("aria-label", "완료 표시");
          cb.addEventListener("change", function () {
            var all = loadTodos();
            var item = all.find(function (x) { return x.id === t.id; });
            if (item) {
              item.done = cb.checked;
              saveTodos(all);
              renderTodos();
            }
          });

          var span = document.createElement("span");
          span.className = "text";
          span.textContent = t.text;
          span.addEventListener("click", function () {
            cb.checked = !cb.checked;
            cb.dispatchEvent(new Event("change"));
          });

          var del = document.createElement("button");
          del.type = "button";
          del.className = "btn-ghost";
          del.setAttribute("aria-label", "삭제");
          del.innerHTML =
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
          del.addEventListener("click", function () {
            saveTodos(loadTodos().filter(function (x) { return x.id !== t.id; }));
            renderTodos();
          });

          li.appendChild(cb);
          li.appendChild(span);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      document.getElementById("todoForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var input = document.getElementById("todoInput");
        var text = (input.value || "").trim();
        if (!text) return;
        var todos = loadTodos();
        todos.unshift({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          text: text,
          done: false
        });
        saveTodos(todos);
        input.value = "";
        renderTodos();
        input.focus();
      });

      /* ── Notes ── */
      var notesTimer = null;

      function loadNotes() {
        try {
          return localStorage.getItem(KEY_NOTES) || "";
        } catch (e) {
          return "";
        }
      }

      function saveNotes(val) {
        localStorage.setItem(KEY_NOTES, val);
        var status = document.getElementById("notesStatus");
        status.textContent = "저장됨";
        clearTimeout(notesTimer);
        notesTimer = setTimeout(function () {
          status.textContent = "";
        }, 1500);
      }

      var notesArea = document.getElementById("notesArea");
      notesArea.value = loadNotes();
      notesArea.addEventListener("input", function () {
        document.getElementById("notesStatus").textContent = "저장 중…";
        clearTimeout(notesTimer);
        notesTimer = setTimeout(function () {
          saveNotes(notesArea.value);
        }, 400);
      });

      /* ── Links ── */
      function loadLinks() {
        try {
          var raw = localStorage.getItem(KEY_LINKS);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveLinks(links) {
        localStorage.setItem(KEY_LINKS, JSON.stringify(links));
      }

      function normalizeUrl(url) {
        var u = (url || "").trim();
        if (!u) return "";
        if (!/^https?:\/\//i.test(u)) u = "https://" + u;
        return u;
      }

      function renderLinks() {
        var list = document.getElementById("linkList");
        var links = loadLinks();
        list.innerHTML = "";

        if (links.length === 0) {
          list.innerHTML = '<li class="empty-hint">빠른 링크를 추가하세요</li>';
          return;
        }

        links.forEach(function (L) {
          var li = document.createElement("li");
          li.className = "link-item";

          var a = document.createElement("a");
          a.href = L.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.innerHTML =
            '<span class="link-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg></span>';
          var nameSpan = document.createElement("span");
          nameSpan.textContent = L.name;
          a.appendChild(nameSpan);

          var del = document.createElement("button");
          del.type = "button";
          del.className = "btn-ghost";
          del.setAttribute("aria-label", "삭제");
          del.innerHTML =
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
          del.addEventListener("click", function () {
            saveLinks(loadLinks().filter(function (x) { return x.id !== L.id; }));
            renderLinks();
          });

          li.appendChild(a);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      document.getElementById("linkForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var nameEl = document.getElementById("linkName");
        var urlEl = document.getElementById("linkUrl");
        var name = (nameEl.value || "").trim();
        var url = normalizeUrl(urlEl.value);
        if (!name || !url) return;
        try {
          new URL(url);
        } catch (err) {
          urlEl.focus();
          return;
        }
        var links = loadLinks();
        links.unshift({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          name: name,
          url: url
        });
        saveLinks(links);
        nameEl.value = "";
        urlEl.value = "";
        renderLinks();
        nameEl.focus();
      });

      /* ── Init ── */
      renderDate();
      fetchWeather();
      renderTodos();
      renderLinks();

      // Refresh date at local midnight (no live clock display)
      function scheduleMidnightRefresh() {
        var now = new Date();
        var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
        setTimeout(function () {
          renderDate();
          scheduleMidnightRefresh();
        }, next - now);
      }
      scheduleMidnightRefresh();
    })();
  </script>
</body>
</html>
